<script>
    let activeUserSession = null;
    let activeSchemeSpeechContext = "";
    let activeSchemeOriginalInstructions = "";
    let activeSchemeSimpleInstructions = [];
    let isSimplifiedText = false;
    let activeInputId = 'username';

    const SCHEME_NAMES = {
        'senior-citizen': 'Senior Citizen Pension Scheme',
        'student-loan': 'Student Education Loan Scheme',
        'jan-dhan': 'PM Jan Dhan Yojana (PMJDY)',
        'sukanya-samriddhi': 'Sukanya Samriddhi Yojana (SSY)',
        'kisan-credit': 'Kisan Credit Card (KCC) Scheme',
        'atal-pension': 'Atal Pension Yojana (APY)',
        'home-loan': 'PM Awas Yojana Home Loan Support',
        'mudra-loan': 'Mudra Micro Business Loan (PMMY)',
        'fixed-deposit': 'Tax Saver Fixed Deposit Scheme',
        'nsc': 'National Savings Certificate (NSC)'
    };

    const TEXT_SIZES = [1, 1.15, 1.3, 1.45, 1.6, 1.8];
    let textSizeIndex = Number(localStorage.getItem('accessBankTextSizeIndex') || 0);

    // Verify session when page loads
    window.addEventListener('DOMContentLoaded', checkSession);

    async function checkSession() {
        try {
            const r = await fetch('/api/me');
            if (r.ok) {
                const data = await r.json();
                activeUserSession = data.profile;
                activeUserSession.username = data.username;
                if (activeUserSession.isFrozen) {
                    document.getElementById('app').classList.add('hidden');
                    document.getElementById('freezeOverlay').classList.remove('hidden');
                } else {
                    unlockDashboard();
                }
            }
        } catch (e) {
            console.log("No active session found.");
        }
    }

    function switchAuthTab(tab) {
        const loginForm = document.getElementById('loginForm');
        const signupForm = document.getElementById('signupForm');
        const tabLoginBtn = document.getElementById('tabLoginBtn');
        const tabSignupBtn = document.getElementById('tabSignupBtn');

        if (tab === 'login') {
            loginForm.classList.remove('hidden');
            signupForm.classList.add('hidden');
            tabLoginBtn.classList.add('active');
            tabSignupBtn.classList.remove('active');
            setActiveInput('username');
        } else {
            loginForm.classList.add('hidden');
            signupForm.classList.remove('hidden');
            tabLoginBtn.classList.remove('active');
            tabSignupBtn.classList.add('active');
            setActiveInput('signupUsername');
        }
    }

    function applyTextSize() {
        textSizeIndex = Math.max(0, Math.min(TEXT_SIZES.length - 1, textSizeIndex));
        document.documentElement.style.setProperty('--text-scale', TEXT_SIZES[textSizeIndex]);
        document.getElementById('textSizeLabel').textContent =
            `🔍 Text Size (${Math.round(TEXT_SIZES[textSizeIndex] * 100)}%)`;
        localStorage.setItem('accessBankTextSizeIndex', textSizeIndex);
    }

    function increaseTextSize() {
        if (textSizeIndex < TEXT_SIZES.length - 1) {
            textSizeIndex++;
            applyTextSize();
        }
    }

    function decreaseTextSize() {
        if (textSizeIndex > 0) {
            textSizeIndex--;
            applyTextSize();
        }
    }

    function resetTextSize() {
        textSizeIndex = 0;
        applyTextSize();
    }

    function toggleContrast() { document.body.classList.toggle('high-contrast'); }
    function stopSpeech() { window.speechSynthesis.cancel(); }

    applyTextSize();

    function setActiveInput(id) {
        activeInputId = id;
        const targetInput = document.getElementById(id);
        const labelText = targetInput ? (targetInput.placeholder || id) : id;
        document.getElementById('lblActiveInput').innerText = labelText;
    }

    function toggleKeyboard() {
        const kb = document.getElementById('virtualKeyboard');
        const btn = document.getElementById('btnToggleKeyboard');
        const isHidden = kb.classList.contains('hidden');
        if (isHidden) {
            kb.classList.remove('hidden');
            if (btn) btn.setAttribute('aria-expanded', 'true');
            if (!document.getElementById('keyboardKeys').children.length) {
                buildKeyboardLayout();
            }
        } else {
            kb.classList.add('hidden');
            if (btn) btn.setAttribute('aria-expanded', 'false');
        }
    }

    function buildKeyboardLayout() {
        const layout = [
            '1','2','3','4','5','6','7','8','9','0',
            'q','w','e','r','t','y','u','i','o','p',
            'a','s','d','f','g','h','j','k','l','⌫',
            'z','x','c','v','b','n','m','CLEAR'
        ];
        const container = document.getElementById('keyboardKeys');
        container.innerHTML = "";

        layout.forEach(key => {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'key-btn';
            
            if (key === 'CLEAR') {
                btn.innerText = 'Clear';
                btn.classList.add('key-wide', 'key-action');
                btn.onclick = () => handleKeyPress('CLEAR');
            } else if (key === '⌫') {
                btn.innerText = '⌫';
                btn.classList.add('key-action');
                btn.onclick = () => handleKeyPress('BACKSPACE');
            } else {
                btn.innerText = key;
                btn.onclick = () => handleKeyPress(key);
            }
            container.appendChild(btn);
        });
    }

    function handleKeyPress(char) {
        const targetInput = document.getElementById(activeInputId);
        if (!targetInput) return;

        if (char === 'BACKSPACE') {
            targetInput.value = targetInput.value.slice(0, -1);
        } else if (char === 'CLEAR') {
            targetInput.value = "";
        } else {
            targetInput.value += char;
        }
        targetInput.focus();
    }

    function readSecurityAlert() {
        window.speechSynthesis.cancel();
        const listItems = document.querySelectorAll('#fraudAlertList li');
        let alertText = "Security Alert: Be Aware of Scammers. ";
        listItems.forEach(item => {
            alertText += item.innerText.replace('⚠️', 'Warning:') + ". ";
        });
        const u = new SpeechSynthesisUtterance(alertText);
        u.rate = voiceSpeed;
        window.speechSynthesis.speak(u);
    }

    async function emergencyFreezeAccount() {
        if (!activeUserSession || !activeUserSession.username) {
            alert("No active session detected.");
            return;
        }

        const confirmAction = confirm("🚨 EMERGENCY CONFIRMATION: Are you sure you want to immediately lock down your account?");
        if (!confirmAction) return;

        try {
            const r = await fetch('/api/freeze-account', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' }
            });

            if (!r.ok) throw new Error('Account lock operation failed.');
            
            window.speechSynthesis.cancel();
            document.getElementById('app').classList.add('hidden');
            document.getElementById('freezeOverlay').classList.remove('hidden');

            const alertUtterance = new SpeechSynthesisUtterance(
                "Account securely frozen. Security containment activated. To unlock, please visit your local physical branch office with a valid identity proof document."
            );
            alertUtterance.rate = voiceSpeed;
            window.speechSynthesis.speak(alertUtterance);
        } catch(e) {
            alert("Security freeze error: " + e.message);
        }
    }

    async function attemptLogin() {
        const u = document.getElementById('username').value;
        const p = document.getElementById('password').value;
        try {
            const r = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: u, password: p })
            });
            if (!r.ok) {
                const errData = await r.json();
                throw new Error(errData.error || 'Authorization rejected');
            }
            const responseData = await r.json();
            
            activeUserSession = responseData.profile;
            activeUserSession.username = responseData.username || u;

            if (activeUserSession.isFrozen) {
                document.getElementById('app').classList.add('hidden');
                document.getElementById('freezeOverlay').classList.remove('hidden');
                return;
            }

            unlockDashboard();
        } catch(e) { alert(e.message); }
    }

    async function attemptSignup() {
        const payload = {
            username: document.getElementById('signupUsername').value,
            password: document.getElementById('signupPassword').value,
            fullName: document.getElementById('signupFullName').value,
            dateOfBirth: document.getElementById('signupDob').value,
            address: document.getElementById('signupAddress').value,
            phone: document.getElementById('signupPhone').value,
            email: document.getElementById('signupEmail').value,
            governmentId: document.getElementById('signupGovId').value
        };

        try {
            const r = await fetch('/api/signup', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const responseData = await r.json();
            if (!r.ok) {
                throw new Error(responseData.error || 'Registration failed');
            }

            alert("Account created successfully! Logging you in...");
            activeUserSession = responseData.profile;
            activeUserSession.username = responseData.username || payload.username;
            unlockDashboard();
        } catch(e) {
            alert("Signup Error: " + e.message);
        }
    }

    function unlockDashboard() {
        document.getElementById('authSection').classList.add('hidden');
        document.getElementById('dashboardSection').classList.remove('hidden');
        document.getElementById('logoutBtn').classList.remove('hidden');
        
        document.getElementById('lblBalance').innerText = activeUserSession.accountBalance || "₹1,24,500.00";
        document.getElementById('lblCibil').innerText = activeUserSession.creditScore || "780 (Excellent)";
        
        const list = document.getElementById('txHistoryList');
        list.innerHTML = "";
        const history = activeUserSession.transactionHistory || ["No recent transactions."];
        history.forEach(tx => {
            let li = document.createElement('li'); li.innerText = tx; list.appendChild(li);
        });
    }

    async function triggerAutoFill() {
        try {
            const res = await fetch('/api/autofill-profile');
            if (!res.ok) throw new Error("Unauthorized profile request");
            const profile = await res.json();
            document.getElementById('frmName').value = profile.fullName || "";
            document.getElementById('frmDob').value = profile.dateOfBirth || "";
            document.getElementById('frmAddr').value = profile.address || "";
            document.getElementById('frmGovId').value = profile.governmentId || "";
        } catch(e) {
            alert("Unable to autofill: " + e.message);
        }
    }

    function createSimpleInstructions(instructions) {
        const text = (instructions || "").trim();
        if (!text) return ["No instructions are available for this scheme."];

        const sentences = text.split(/(?<=[.!?])\s+/).map(s => s.trim()).filter(Boolean);

        const simplified = sentences.map(sentence => sentence
            .replace(/identity/gi, "ID")
            .replace(/documents/gi, "papers")
            .replace(/document/gi, "paper")
            .replace(/authorized service center/gi, "approved service center")
            .replace(/participating bank/gi, "partner bank")
            .replace(/financial/gi, "money-related")
            .replace(/submit/gi, "give")
            .replace(/complete/gi, "fill in")
            .replace(/application/gi, "form")
            .replace(/\s+/g, " ").trim()
        ).filter(Boolean);

        return simplified.length ? simplified : ["Follow the instructions shown above."];
    }

    function renderSimpleInstructions() {
        const list = document.getElementById("schSimpleInstructions");
        list.innerHTML = "";
        activeSchemeSimpleInstructions.forEach(instruction => {
            const li = document.createElement("li");
            li.innerText = instruction;
            list.appendChild(li);
        });
    }

    function resetInstructionDisplay() {
        isSimplifiedText = false;
        document.getElementById("schInstructions").classList.remove("hidden");
        document.getElementById("schSimpleInstructions").classList.add("hidden");
        const button = document.getElementById("btnSimplifyText");
        button.innerText = "📄 Simplify Text";
        button.setAttribute("aria-pressed", "false");
    }

    function toggleSimplifiedText() {
        if (!activeSchemeOriginalInstructions) return;

        isSimplifiedText = !isSimplifiedText;
        const original = document.getElementById("schInstructions");
        const simple = document.getElementById("schSimpleInstructions");
        const button = document.getElementById("btnSimplifyText");

        if (isSimplifiedText) {
            original.classList.add("hidden");
            simple.classList.remove("hidden");
            button.innerText = "📄 Show Original Text";
            button.setAttribute("aria-pressed", "true");
        } else {
            simple.classList.add("hidden");
            original.classList.remove("hidden");
            button.innerText = "📄 Simplify Text";
            button.setAttribute("aria-pressed", "false");
        }
    }

    async function fetchScheme(id) {
        try {
            const r = await fetch('/api/scheme/' + id);
            if (!r.ok) {
                throw new Error('Scheme detail not found on server');
            }
            const scheme = await r.json();
            document.getElementById('schemeDetailCard').classList.remove('hidden');
            
            const resolvedName = scheme.schemeName || scheme.name || SCHEME_NAMES[id] || 'Government Scheme Detail';
            document.getElementById('schTitle').innerText = resolvedName;
            
            activeSchemeOriginalInstructions = scheme.instructions || "Please visit your nearest bank branch to initiate application verification for this scheme.";
            activeSchemeSimpleInstructions = createSimpleInstructions(activeSchemeOriginalInstructions);

            document.getElementById('schInstructions').innerText = activeSchemeOriginalInstructions;
            renderSimpleInstructions();
            resetInstructionDisplay();

            document.getElementById('schVideo').src = scheme.videoUrl || "https://example.com";
            
            const docsList = document.getElementById('schDocs');
            docsList.innerHTML = "";
            const docs = (scheme.requiredDocuments && scheme.requiredDocuments.length) 
                ? scheme.requiredDocuments 
                : ["Aadhaar Card", "Identity Proof", "Address Proof", "Passport Size Photo"];
                
            docs.forEach(doc => {
                let li = document.createElement('li'); 
                li.innerText = doc; 
                docsList.appendChild(li);
            });

            activeSchemeSpeechContext = `Scheme name: ${resolvedName}. Required documents are: ${docs.join(', ')}. Instructions: ${activeSchemeOriginalInstructions}`;
        } catch(e) { 
            console.error(e);
            document.getElementById('schemeDetailCard').classList.remove('hidden');
            const fallbackName = SCHEME_NAMES[id] || 'Government Scheme Detail';
            document.getElementById('schTitle').innerText = fallbackName;
            
            activeSchemeOriginalInstructions = "Please visit your nearest bank branch or official portal for enrollment details.";
            activeSchemeSimpleInstructions = createSimpleInstructions(activeSchemeOriginalInstructions);
            
            document.getElementById('schInstructions').innerText = activeSchemeOriginalInstructions;
            renderSimpleInstructions();
            resetInstructionDisplay();
            
            const docsList = document.getElementById('schDocs');
            docsList.innerHTML = "";
            ["Identity Proof", "Address Proof", "Government ID Card"].forEach(doc => {
                let li = document.createElement('li');
                li.innerText = doc;
                docsList.appendChild(li);
            });

            activeSchemeSpeechContext = `Scheme name: ${fallbackName}. Please visit your nearest bank branch for details.`;
        }
    }

    let voiceSpeed = Number(localStorage.getItem('accessBankVoiceSpeed') || 1.0);

    function setVoiceSpeed(speed) {
        const selectedSpeed = Number(speed);
        if ([0.7, 1.0, 1.3].includes(selectedSpeed)) {
            voiceSpeed = selectedSpeed;
            localStorage.setItem('accessBankVoiceSpeed', voiceSpeed);
        }
    }

    function applySavedVoiceSpeed() {
        const selector = document.getElementById('voiceSpeed');
        if (!selector) return;

        const savedSpeed = Number(localStorage.getItem('accessBankVoiceSpeed') || 1.0);
        voiceSpeed = [0.7, 1.0, 1.3].includes(savedSpeed) ? savedSpeed : 1.0;
        selector.value = String(voiceSpeed);
    }

    function readActiveContext() {
        if (!activeSchemeSpeechContext) return;
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(activeSchemeSpeechContext);
        u.rate = voiceSpeed;
        window.speechSynthesis.speak(u);
    }

    applySavedVoiceSpeed();

    async function logout() {
        try {
            await fetch('/api/logout', { method: 'POST' });
        } catch(e) {
            console.error("Logout request failed:", e);
        }
        activeUserSession = null;
        window.speechSynthesis.cancel();
        document.getElementById('authSection').classList.remove('hidden');
        document.getElementById('dashboardSection').classList.add('hidden');
        document.getElementById('schemeDetailCard').classList.add('hidden');
        document.getElementById('logoutBtn').classList.add('hidden');
    }
</script>
